<div class="csgo-search-wrapper">
  <div class="search-icon">
    <i class="bi bi-search"></i>
  </div>
  <input
    type="text"
    class="csgo-search-input"
    placeholder="Buscar en arsenal..."
    [(ngModel)]="textValue"
    (ngModelChange)="onValueChange($event)"
  />
  @if(textValue()) {
    <button class="search-clear-btn" type="button" (click)="clear()">
      <i class="bi bi-x-lg"></i>
    </button>
  }
</div>
