<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/">MiTienda</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">Productos</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        
        <app-search></app-search>
        <app-product-filter></app-product-filter>

        <a routerLink="/cart" class="position-relative text-decoration-none text-dark">
          <i class="bi bi-cart fs-4"></i>
          @if (totalItems() > 0) {
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ totalItems() }}
            </span>
          }
        </a>

        @if (isAuthenticated()) {
          <span class="fw-semibold">{{ user()?.firstName }} {{ user()?.lastName }}</span>
          <button (click)="logout()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
        } @else {
          <a routerLink="/auth/login" class="btn btn-outline-primary btn-sm">Iniciar sesión</a>
          <a routerLink="/auth/register" class="btn btn-outline-success btn-sm">Registrarse</a>
        }
      </div>
    </div>
  </div>
</nav>
