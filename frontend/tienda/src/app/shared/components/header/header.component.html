<nav class="csgo-navbar sticky-top">
  <div class="container-fluid">
    <div class="csgo-nav-wrapper">
      <!-- Logo/Brand -->
      <a class="csgo-brand" routerLink="/">
        <div class="brand-icon">
          <i class="bi bi-crosshair"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">CS:GO</span>
          <span class="brand-subtitle">MARKET</span>
        </div>
      </a>

      <!-- Mobile Toggle -->
      <button class="csgo-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarContent">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <!-- Navigation Links -->
        <ul class="csgo-nav-menu">
          <li class="csgo-nav-item">
            <a class="csgo-nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
              <i class="bi bi-house-door-fill"></i>
              <span>Inicio</span>
            </a>
          </li>
          <li class="csgo-nav-item">
            <a class="csgo-nav-link" routerLink="/products" routerLinkActive="active">
              <i class="bi bi-grid-fill"></i>
              <span>Arsenal</span>
            </a>
          </li>
          <li class="csgo-nav-item">
            <a class="csgo-nav-link" routerLink="/products/agregar" routerLinkActive="active">
              <i class="bi bi-plus-circle-fill"></i>
              <span>Agregar</span>
            </a>
          </li>
        </ul>

        <!-- Right Side Actions -->
        <div class="csgo-nav-actions">
          @if(!esCarrito() && !esAgregarProducto()) {
            <div class="filter-search-group">
              <app-product-filter></app-product-filter>
              <app-search></app-search>
            </div>
          }

          <!-- Cart -->
          <a routerLink="/cart" class="csgo-cart-btn">
            <i class="bi bi-bag-fill"></i>
            @if (totalItems() > 0) {
              <span class="cart-badge">{{ totalItems() }}</span>
            }
          </a>

          <!-- User Actions -->
          <div class="csgo-user-section">
            @if (isAuthenticated()) {
              <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span class="user-name">{{ user()?.firstName }} {{ user()?.lastName }}</span>
              </div>
              <button (click)="logout()" class="btn btn-danger btn-sm csgo-btn">
                <i class="bi bi-box-arrow-right"></i>
                Salir
              </button>
            } @else {
              <a routerLink="/auth/login" class="btn btn-outline-primary btn-sm csgo-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
              </a>
              <a routerLink="/auth/register" class="btn btn-outline-success btn-sm csgo-btn">
                <i class="bi bi-person-plus-fill"></i>
                Registro
              </a>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
