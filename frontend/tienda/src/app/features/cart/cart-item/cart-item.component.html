<div class="csgo-cart-item">
  <div class="item-body">
    <div class="row align-items-center">
      <!-- Product Image -->
      <div class="col-md-2 col-4 item-image-wrapper">
        <div class="item-image">
          <i class="bi bi-box-seam"></i>
        </div>
      </div>

      <!-- Product Details -->
      <div class="col-md-4 col-8 item-details">
        <h5 class="item-title">{{ item().producto.nombre }}</h5>
        <div class="item-price-info">
          <span>Precio unitario:</span>
          <span class="unit-price">${{ item().producto.precio }}</span>
        </div>
      </div>

      <!-- Quantity Controls -->
      <div class="col-md-3 col-12 quantity-section">
        <div class="quantity-controls">
          <button class="qty-btn" 
                  type="button"
                  (click)="onDecrement()"
                  [disabled]="item().cantidad <= 1">
            <i class="bi bi-dash"></i>
          </button>
          <input type="text" 
                 class="qty-input" 
                 [value]="item().cantidad" 
                 readonly>
          <button class="qty-btn" 
                  type="button"
                  (click)="onIncrement()">
            <i class="bi bi-plus"></i>
          </button>
        </div>
        <span class="qty-label">Cantidad</span>
      </div>

      <!-- Subtotal & Remove -->
      <div class="col-md-3 col-12 item-actions">
        <div class="item-subtotal">${{ item().total }}</div>
        <button class="remove-btn" 
                type="button"
                (click)="onRemove()">
          <i class="bi bi-trash3-fill"></i>
          <span>Eliminar</span>
        </button>
      </div>
    </div>
  </div>
</div>
