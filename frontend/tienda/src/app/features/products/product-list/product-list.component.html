<div class="container csgo-products-container">
    <div class="row g-4">
      @for(product of filteredProducts(); track product.id) {
        <div class="col-6 col-md-4 col-lg-3">
          <app-product-detail
            [product]="product"
            (addToCart)="addToCart(product,1)" 
            >
          </app-product-detail>
        </div>
      }

      @if(filteredProducts().length === 0) {
        <div class="col-12">
          <div class="empty-state">
            <i class="bi bi-search"></i>
            <p>No se encontraron productos en el arsenal</p>
          </div>
        </div>
      }
    </div>
</div>
