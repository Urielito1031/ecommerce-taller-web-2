<div class="accordion" id="accordionFiltros">
  
  <!-- Acordeón Item: Categorías -->
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button 
        class="accordion-button collapsed" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#collapseCategorias"
        aria-expanded="false" 
        aria-controls="collapseCategorias"
      >
        <i class="bi bi-tags me-2"></i>
        Categorías
      </button>
    </h2>
    
    <div 
      id="collapseCategorias" 
      class="accordion-collapse collapse"
      data-bs-parent="#accordionFiltros"
    >
      <div class="accordion-body p-0">
        <div class="list-group list-group-flush">
          
          <!-- ✅ Iterar sobre las categorías -->
          @for (categoria of categorias(); track categoria.id) {
            <button
              type="button"
              class="list-group-item list-group-item-action d-flex align-items-center"
              (click)="filtrarPorCategoria(categoria.id)"
            >
              <i class="bi {{ categoria.icono }} me-3"></i>
              <span>{{ categoria.nombre }}</span>
            </button>
          }
          
          <!-- ✅ Estado vacío -->
          @if (categorias().length === 0) {
            <div class="list-group-item text-muted text-center">
              <small>No hay categorías disponibles</small>
            </div>
          }
          
        </div>
      </div>
    </div>
  </div>

  <!-- Puedes agregar más acordeones aquí (Precio, Marca, etc.) -->
  
</div>
