<div>
    <select [(ngModel)]="categoriaSeleccionadaId">
        <option value="" disabled selected>Todos los categorías</option>
        @for (item of categorias(); track item.id) {
            <option [ngValue]="item.id">{{ item.nombre}}</option>
        }
    </select>
    <button (click)="aplicarFiltro()" type="button">Aplicar filtro</button>
    
</div>
