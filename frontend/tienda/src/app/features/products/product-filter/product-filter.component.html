  <div>

      <input type="number" placeholder="Precio mínimo" [(ngModel)]="precioMinimo" (input)="actualizarPrecioMinimo()"/>
      <input type="number" placeholder="Precio maximo" [(ngModel)]="precioMaximo" (input)="actualizarPrecioMaximo()"/>

      <select [(ngModel)]="categoriaSeleccionadaId" (ngModelChange)="aplicarFiltro()">
          <option [ngValue]=0 selected>Todas las categorías</option>
          @for (item of categorias(); track item.id) {
              <option [ngValue]="item.id" >{{ item.nombre}}</option>
          }
      </select>
      
  </div>
