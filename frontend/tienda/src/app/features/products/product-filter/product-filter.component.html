<div>

    <input type="number" placeholder="Precio mínimo" [(ngModel)]="precioMinimo" (input)="filtrarPorPrecio()"/>
    <input type="number" placeholder="Precio maximo" [(ngModel)]="precioMaximo" (input)="filtrarPorPrecio()"/>

    <select [(ngModel)]="categoriaSeleccionadaId" (click)="aplicarFiltro()">
        <option value="" selected>Todas las categorías</option>
        @for (item of categorias(); track item.id) {
            <option [ngValue]="item.id" >{{ item.nombre}}</option>
        }
    </select>
    
</div>
