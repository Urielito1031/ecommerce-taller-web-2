<div class="card border-0 shadow-sm h-100 product-card">
  <!-- Imagen -->
  <div class="position-relative overflow-hidden rounded-top ratio ratio-1x1 bg-light">
    <img
      [src]="product.image"
      [alt]="product.title"
      class="card-img-top object-fit-cover transition"
    />
  </div>

  <!-- Cuerpo -->
  <div class="card-body d-flex flex-column justify-content-between">
    <div>
      <h6 class="card-title text-truncate fw-semibold mb-2">{{ product.title }}</h6>
      <p class="card-text text-muted small text-truncate-2 mb-3">{{ product.description }}</p>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-auto">
      <strong class="text-primary fs-6">${{ product.price }}</strong>
      <app-button
        label="Agregar"
        variant="warning"
        size="sm"
        (clicked)="onAddToCart()">
      </app-button>
    </div>
  </div>
</div>
